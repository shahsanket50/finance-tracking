# Ruff configuration for finance-backend
# Covers G1 (format) and G2 (lint) gates

line-length = 100
target-version = "py312"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
]
ignore = []

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
indent-style = "space"
