name: Quality Report

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality-report:
    name: "Quality Report"
    runs-on: ubuntu-latest
    # Run after all gate jobs — we want their conclusions
    needs:
      - format
      - lint
      - typecheck
      - unit-tests
      - property-tests
      - golden-dataset
      - integration-tests
      - coverage
      - real-data-guard
      - migration-check
    if: always()  # run even if some gates failed
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -e "backend/[dev]"

      # Download coverage artifact from the CI workflow
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .
        continue-on-error: true  # artifact absent on first push

      # Download test results if available
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .
        continue-on-error: true

      # Restore coverage baseline (same cache key pattern as coverage job)
      - name: Restore coverage baseline
        uses: actions/cache@v4
        with:
          path: .coverage-baseline.json
          key: coverage-baseline-${{ github.sha }}
          restore-keys: |
            coverage-baseline-

      - name: Generate report
        id: report
        run: |
          python ci/reports/generate_report.py \
            --coverage-xml coverage.xml \
            --test-results test-results.json \
            --pr-number "${{ github.event.pull_request.number }}" \
            > /tmp/quality-report.md
          cat /tmp/quality-report.md
        env:
          PYTHONPATH: .
          REAL_DATA_STATUS: ${{ needs.real-data-guard.result }}
          MIGRATION_STATUS: ${{ needs.migration-check.result }}

      # Post/update PR comment (only on pull_request events)
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-report
          path: /tmp/quality-report.md
